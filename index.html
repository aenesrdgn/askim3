    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #fce4ec;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      color: #880e4f;
    }
    h1 {
      margin: 0 20px 20px;
      font-size: 2rem;
    }
    img {
      max-width: 300px;
      border-radius: 20px;
      margin-top: 20px;
    }
    iframe {
      margin-top: 20px;
      border: none;
    }
    #password-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #site-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 25px;
      font-size: 30px;
      border-radius: 50%;
      background-color: #ec407a;
      color: white;
      border: none;
      cursor: pointer;
    }
    #error {
      margin-top: 10px;
      color: #d50000;
    }
    #menu-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 30px;
      cursor: pointer;
    }
    #dropdown-menu {
      display: none;
      position: absolute;
      top: 60px;
      right: 20px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    #dropdown-menu a {
      display: block;
      padding: 10px 20px;
      text-decoration: none;
      color: #880e4f;
      font-size: 16px;
    }
    #dropdown-menu a:hover {
      background-color: #fce4ec;
    }
  </style>
</head>

    <h1>Şifreyi gir aşkım 💖</h1>
    <input type="password" id="password" placeholder="Şifre">
    <button onclick="checkPassword()">Giriş yap</button>
    <div id="error"></div>
  </div>

    <button id="menu-button" onclick="toggleMenu()">☰</button>
    <div id="dropdown-menu">

      <a href="takvim.html">Takvim</a>
    </div>

    let shownReasons = [];

    function showRandomReason() {
      if (shownReasons.length === data.length) {
        shownReasons = [];
      }

      let item;
      do {
        item = data[Math.floor(Math.random() * data.length)];
      } while (shownReasons.includes(item.reason));

      shownReasons.push(item.reason);

      document.getElementById("reason").textContent = item.reason;

      const photo = document.getElementById("photo");
      if (item.photo) {
        photo.src = item.photo;
        photo.style.display = 'block';
      } else {
        photo.style.display = 'none';
      }

      const music = document.getElementById("music");
      if (item.music) {
        music.src = item.music;
        music.style.display = 'block';
      } else {
        music.style.display = 'none';
        music.src = "";
      }
    }

    function checkPassword() {
      const input = document.getElementById("password").value;
      if (input === "18042023") {
        document.getElementById("password-container").style.display = "none";
        document.getElementById("site-container").style.display = "flex";
        document.getElementById("reason").textContent = "";
      } else {
        document.getElementById("error").textContent = "Aşkım şifreyi ben koydum, ne kadar zor olabilir ki?";
      }

    function toggleMenu() {
      const menu = document.getElementById("dropdown-menu");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
